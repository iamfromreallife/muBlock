name: Build and publish muBlock
# Build on demand or on a final source release-trigger commit, not on each
# intermediate source commit. Every build produces a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/RELEASE_TRIGGER"]
permissions:
  contents: write
concurrency:
  group: mublock-package-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out finalized main with commit history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Copy upstream uBlock Origin Lite Chromium build
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/uBlockOrigin/uBOL-home.git "$RUNNER_TEMP/uBOL-home"
          rm -rf dist/chrome-unpacked
          mkdir -p dist/chrome-unpacked
          cp -a "$RUNNER_TEMP/uBOL-home/chromium/." dist/chrome-unpacked/
          cp "$RUNNER_TEMP/uBOL-home/LICENSE" LICENSE
          git -C "$RUNNER_TEMP/uBOL-home" rev-parse HEAD > dist/UPSTREAM_COMMIT.txt
      - name: Install build-only icon renderer
        run: python3 -m pip install --disable-pip-version-check --user cairosvg==2.8.2 pillow==12.0.0
      - name: Apply muBlock UI overlay
        run: python3 scripts/apply_overlay.py dist/chrome-unpacked
      - name: Get version and artifact name from final manifest
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("dist/chrome-unpacked/manifest.json"))["version"])')"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then exit 1; fi
          echo "MUBLOCK_VERSION=$version" >> "$GITHUB_ENV"
          echo "MUBLOCK_ARCHIVE=muBlock_$version.zip" >> "$GITHUB_ENV"
          echo "MUBLOCK_TAG=v$version-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Create versioned install ZIP
        run: (cd dist && zip -q -r "muBlock_$MUBLOCK_VERSION.zip" chrome-unpacked)
      - name: Publish versioned workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: muBlock_${{ env.MUBLOCK_VERSION }}
          path: dist/muBlock_${{ env.MUBLOCK_VERSION }}.zip
          if-no-files-found: error
      - name: Refresh README direct installation link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("README.md")
          text=p.read_text("utf-8")
          start="<!-- MU_INSTALL_START -->"
          end="<!-- MU_INSTALL_END -->"
          if text.count(start)!=1 or text.count(end)!=1:
              raise SystemExit("README install-link markers missing")
          repo=os.environ["GITHUB_REPOSITORY"]
          tag=os.environ["MUBLOCK_TAG"]
          file=os.environ["MUBLOCK_ARCHIVE"]
          url=f"https://github.com/{repo}/releases/download/{tag}/{file}"
          p.write_text(text.split(start)[0]+start+"\n"+
             f"[**Download {file} directly**]({url})"+"\n"+
             end+text.split(end,1)[1],encoding="utf-8")
          PY
      - name: Commit generated distribution and README to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md LICENSE dist/UPSTREAM_COMMIT.txt dist/chrome-unpacked
          if ! git diff --cached --quiet; then
            git commit -m "Publish muBlock $MUBLOCK_VERSION (build $GITHUB_RUN_NUMBER)"
            git push origin HEAD:main
          fi
      - name: Generate release notes from the last successfully published commit
        run: |
          set -euo pipefail
          # GitHub Releases API endpoints may be unavailable for this repo.
          # A repo-tracked SHA provides a stable, verified release baseline.
          previous_sha="$(tr -d '[:space:]' < .github/LAST_PUBLISHED_COMMIT)"
          if [[ ! "$previous_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid last-published commit SHA" >&2
            exit 1
          fi
          git cat-file -e "$previous_sha^{commit}"
          if ! git merge-base --is-ancestor "$previous_sha" HEAD; then
            echo "Last published commit is not an ancestor of the current build" >&2
            exit 1
          fi
          {
            echo "## muBlock $MUBLOCK_VERSION"
            echo
            echo "Download: $MUBLOCK_ARCHIVE (extract and load chrome-unpacked)."
            echo "Upstream uBlock Origin Lite commit: $(cat dist/UPSTREAM_COMMIT.txt)"
            echo "GitHub Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "### New commits since the previous published build"
            echo
            if [[ "$(git rev-list --count "$previous_sha..HEAD")" -gt 0 ]]; then
              git log --reverse --format='- [%h](https://github.com/'"$GITHUB_REPOSITORY"'/commit/%H) %s' \
                --invert-grep --grep='^Publish muBlock ' \
                --grep='^Record last published muBlock ' "$previous_sha..HEAD"
            else
              echo "- No new source commits."
            fi
            echo
            echo "### Credits"
            echo "muBlock is a visual fork of uBlock Origin Lite by Raymond Hill and contributors."
          } > dist/RELEASE_NOTES.md
      - name: Publish GitHub Release with muBlock_VERSION.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub sometimes returns HTTP 500 while finalizing a release,
          # leaving its asset in a draft. Create/upload once, then retry only
          # the publish transition rather than creating duplicate releases.
          title="muBlock $MUBLOCK_VERSION — build $GITHUB_RUN_NUMBER"
          gh release create "$MUBLOCK_TAG" "dist/$MUBLOCK_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file dist/RELEASE_NOTES.md \
            --target "$(git rev-parse HEAD)" \
            --draft
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$MUBLOCK_TAG\") | .id" | head -n 1)"
          if [[ -z "$release_id" ]]; then
            echo "The created draft release could not be found." >&2
            exit 1
          fi
          published=0
          for delay in 2 4 8 16 32; do
            if gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -F draft=false -f make_latest=true -f name="$title" >/dev/null; then
              published=1
              break
            fi
            echo "Transient GitHub release publication failure; retrying in ${delay}s"
            sleep "$delay"
          done
          if [[ "$published" != 1 ]]; then
            echo "Could not publish release after retries; ZIP remains available in Actions artifacts." >&2
            exit 1
          fi
      - name: Record last successfully published muBlock commit
        run: |
          set -euo pipefail
          published_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$published_sha" > .github/LAST_PUBLISHED_COMMIT
          git add .github/LAST_PUBLISHED_COMMIT
          if ! git diff --cached --quiet; then
            git commit -m "Record last published muBlock build $GITHUB_RUN_NUMBER"
            git push origin HEAD:main
          fi
      - name: Keep only main by deleting all other remote branches
        run: |
          set -euo pipefail
          # Every task and release finishes with one single surviving branch.
          # Run only AFTER successfully publishing the GitHub Release and ZIP.
          git ls-remote --heads origin | sed 's#.*refs/heads/##' |
          while IFS= read -r old; do
            if [[ "$old" != "main" ]]; then
              git push origin --delete "$old"
            fi
          done
