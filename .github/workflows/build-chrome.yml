name: Package muBlock Chrome extension

# Build ONLY when all source changes are committed. A release-trigger commit
# to .github/RELEASE_TRIGGER launches exactly one packaging run; routine
# commits do not start an action. workflow_dispatch also allows manual runs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/RELEASE_TRIGGER"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out finalized muBlock source
        uses: actions/checkout@v4

      - name: Copy upstream uBlock Origin Lite Chromium distribution
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/uBlockOrigin/uBOL-home.git "$RUNNER_TEMP/uBOL-home"
          rm -rf dist/chrome-unpacked
          mkdir -p dist/chrome-unpacked
          cp -a "$RUNNER_TEMP/uBOL-home/chromium/." dist/chrome-unpacked/
          cp "$RUNNER_TEMP/uBOL-home/LICENSE" LICENSE
          git -C "$RUNNER_TEMP/uBOL-home" rev-parse HEAD > dist/UPSTREAM_COMMIT.txt

      - name: Install icon renderer
        run: |
          python3 -m pip install --disable-pip-version-check --user cairosvg==2.8.2 pillow==12.0.0

      - name: Apply the finalized muBlock UI overlay
        run: |
          set -euo pipefail
          python3 scripts/apply_overlay.py dist/chrome-unpacked

      - name: Create complete unpacked extension ZIP
        run: |
          set -euo pipefail
          (cd dist && zip -q -r muBlock-chrome-unpacked.zip chrome-unpacked)

      - name: Publish installable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: muBlock-chrome-unpacked
          path: dist/muBlock-chrome-unpacked.zip
          if-no-files-found: error

      - name: Commit generated extension to main
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE dist/UPSTREAM_COMMIT.txt dist/chrome-unpacked
          if ! git diff --cached --quiet; then
            git commit -m "Publish finalized muBlock Chrome extension"
            git push origin HEAD:main
          fi
